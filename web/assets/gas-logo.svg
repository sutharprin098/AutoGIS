<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="gasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#gasBg)" stroke="#C7D2FE" stroke-width="3"/>
  <!-- Geospatial Globe Lat/Lon Grid Ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#A5B4FC" stroke-width="2.5"/>
  <ellipse cx="64" cy="64" rx="20" ry="38" fill="none" stroke="#A5B4FC" stroke-width="2"/>
  <line x1="26" y1="64" x2="102" y2="64" stroke="#A5B4FC" stroke-width="2"/>
  <!-- Multi-Agent Interconnected Mesh Lines -->
  <line x1="64" y1="34" x2="38" y2="76" stroke="#4338CA" stroke-width="2.5" stroke-dasharray="2 2"/>
  <line x1="64" y1="34" x2="90" y2="76" stroke="#4338CA" stroke-width="2.5" stroke-dasharray="2 2"/>
  <line x1="38" y1="76" x2="90" y2="76" stroke="#4338CA" stroke-width="2.5" stroke-dasharray="2 2"/>
  <!-- Distributed Agent Node Hubs -->
  <circle cx="64" cy="34" r="9" fill="url(#gasGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="38" cy="76" r="9" fill="url(#gasGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="90" cy="76" r="9" fill="url(#gasGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="5" fill="#312E81"/>
</svg>
